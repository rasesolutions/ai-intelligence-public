name: Refresh public feed

on:
  workflow_dispatch:
    inputs:
      verification_probe:
        description: Open an unmerged verification PR using metadata formatting only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-feed-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the reviewed public snapshot code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Pin the starting commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test the public-data and Git safeguards
        run: python3 -m unittest discover -s tests -v

      - name: Refresh from the public feed
        run: python3 tools/update_public_snapshot.py --output-dir data

      - name: Prepare verification-only metadata formatting
        if: inputs.verification_probe
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/manifest.json')
          manifest = json.loads(path.read_bytes())
          path.write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=3) + '\n', encoding='utf-8')
          PY

      - name: Propose a validated data-only PR
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_BASE: ${{ steps.base.outputs.sha }}
          VERIFICATION_PROBE: ${{ inputs.verification_probe }}
        run: |
          set -euo pipefail
          snapshot_args=(--base-sha "$SNAPSHOT_BASE")
          if [[ "$VERIFICATION_PROBE" == "true" ]]; then
            snapshot_args+=(--verification-probe)
          fi
          python3 tools/create_snapshot_pr.py "${snapshot_args[@]}" > "$RUNNER_TEMP/public-snapshot-pr.json"

      - name: Summarize the verified proposal
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          proposal = json.loads((Path(os.environ['RUNNER_TEMP']) / 'public-snapshot-pr.json').read_text())
          print('Validated public-data proposal (no direct push to main):')
          print('```json')
          print(json.dumps(proposal, indent=2, ensure_ascii=False))
          print('```')
          PY
